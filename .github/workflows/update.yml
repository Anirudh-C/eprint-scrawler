name: Update papers

on:
  schedule:
    # Daily. eprint.iacr.org's RSS feed is a rolling window, so a daily run
    # keeps up as long as it doesn't fall more than ~a day behind.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and classify papers
        run: python3 scripts/fetch_papers.py

      - name: Commit changes if any
        run: |
          if git diff --quiet -- docs/data/papers.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/papers.json
          git commit -m "Update papers.json"
          git push
